# ==============================================================================
# Smriti-NER (স্মৃতি / ꯁ꯭ꯃ꯭ꯔꯤꯇꯤ) — Nginx TLS 1.3 Reverse Proxy Configuration
# SIH 2026 Problem Statement ID: 26003 | MDoNER
# Compliance: DISHA 2018 (Section 29/34) & MeitY Cloud Security Mandates
# Enforces: TLS 1.3 only, HSTS 2-year preload, zero plaintext PHI transmission
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format disha_audit '$remote_addr - [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" disha_trace="$request_id" '
                          'upstream_time="$upstream_response_time"';

    access_log /var/log/nginx/access.log disha_audit;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate limiting: 50 requests/sec per IP, burst of 20
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # Upstream FastAPI cluster
    upstream fastapi_cluster {
        least_conn;
        server fastapi-core-01:8000 max_fails=3 fail_timeout=10s;
        server fastapi-core-02:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ── 1. HTTP Redirect to HTTPS (Port 80 -> 443) ──────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name api.smriti-ner.gov.in staging.smriti-ner.gov.in localhost;

        # Liveness probe accessible over HTTP for container health monitors
        location /health {
            proxy_pass http://fastapi_cluster/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── 2. Secure HTTPS Server (TLS 1.3 Only) ────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.smriti-ner.gov.in staging.smriti-ner.gov.in localhost;

        # SSL / TLS 1.3 Strict Settings (Zero TLS 1.0, 1.1, 1.2)
        ssl_certificate /etc/ssl/smriti/fullchain.pem;
        ssl_certificate_key /etc/ssl/smriti/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256';
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # DISHA 2018 Mandatory Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none';" always;
        add_header X-DISHA-Data-Sovereignty "IN-GOV-LOCAL" always;
        add_header X-DISHA-Encryption "TLS1.3-AES256GCM" always;
        add_header X-DISHA-Audit-Trace $request_id always;

        # Health endpoint (Zero rate limit)
        location /health {
            proxy_pass http://fastapi_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Telemetry & Clinical Gateway
        location /api/ {
            limit_req zone=api_rate_limit burst=20 nodelay;
            limit_conn addr_conn_limit 10;

            proxy_pass http://fastapi_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Buffering & timeout configs for high-throughput batch telemetry
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            client_max_body_size 10M;
        }
    }
}
