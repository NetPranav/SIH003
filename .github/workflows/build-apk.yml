name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Smriti Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './smriti-ner/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd smriti-ner
          npm ci

      - name: Build Next.js & Sync Capacitor Assets
        run: |
          cd smriti-ner
          npm run build:mobile

      - name: Make Gradlew Executable
        run: chmod +x smriti-ner/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd smriti-ner/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: smriti-android-debug-apk
          path: smriti-ner/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
